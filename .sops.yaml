keys:
  # generate with `sudo nix shell nixpkgs#ssh-to-age -c ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub`
  # after adding a new key: `nix shell nixpkgs#sops -c sops updatekeys secrets/**`
  - &dell  age1fx873ekx44lxx8gcxe2gcagteu6tvkkqr05xpkqjr2thph63dyqq3kvrfx
  - &hall9000 age1tz5cqycwwx5zrdxmd827m93tf97wcswdsl00un5vsyyhaz6s5f8semp9fl
  - &lenowo-thiccpad age1nfqgrlgxytv8fys692h332j93lsk693gw6z9rvwemskzrt3zmupszvnx7u

creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age: [*dell, *hall9000, *lenowo-thiccpad]
  - path_regex: (secrets|/etc/wireguard)/wg0\.conf$
    key_groups:
      - age: [*dell, *lenowo-thiccpad]
  - path_regex: secrets/openproject_secrets\.yaml$
    key_groups:
      - age: [*hall9000]
